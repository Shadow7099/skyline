<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Fila virtual · Skyline Halloween Fest</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Michroma&display=swap');
  @font-face{
    font-family:'Eurostile Extended';
    src: url('https://kyaegqllwjihaoudazoh.supabase.co/storage/v1/object/public/skyline-media/Eurostile%20Extended%20Bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  :root{
    --ink:#160b23;
    --purple-deepest:#1d0e33;
    --purple-deep:#2a1348;
    --purple:#3d1c66;
    --purple-light:#5a3593;
    --purple-glow:#7c4fc4;
    --gold:#f0a93b;
    --gold-deep:#c97e1e;
    --gold-pale:#f7cf8c;
    --bone:#f4ecdb;
    --smoke:#efe6f6;
    --line:#0e0518;
    --danger:#e0556a;
    --ok:#5fbf8f;
    --radius-tag:18px;
    --radius-panel:22px;
    --shadow-hard: 6px 6px 0 var(--line);
    --shadow-hard-sm: 4px 4px 0 var(--line);
    --maxw: 640px;
  }

  *,*::before,*::after{box-sizing:border-box;}

  body{
    margin:0;
    background-color:var(--purple-deepest);
    background-image:
      radial-gradient(rgba(244,236,219,0.06) 1.4px, transparent 1.4px),
      linear-gradient(135deg, rgba(29,14,51,0.95) 0%, rgba(42,19,72,0.93) 50%, rgba(29,14,51,0.96) 100%),
      url('https://kyaegqllwjihaoudazoh.supabase.co/storage/v1/object/public/skyline-media/FONDO%202.webp');
    background-size:16px 16px, auto, cover;
    background-position:0 0, center, center;
    background-repeat:repeat, no-repeat, no-repeat;
    background-attachment:scroll, fixed, fixed;
    color:var(--smoke);
    font-family:'Eurostile Extended', 'Michroma', -apple-system, 'Segoe UI', sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:60px;
  }

  h1,h2,.display{
    font-family:'Eurostile Extended', 'Michroma', sans-serif;
    font-weight:400;
    line-height:0.98;
    letter-spacing:0.5px;
    text-transform:uppercase;
    margin:0;
    color:var(--bone);
  }

  a{color:inherit;}

  .container{max-width:var(--maxw); margin:0 auto; padding:0 20px;}

  .topbar{
    background:rgba(29,14,51,0.92);
    border-bottom:3px solid var(--line);
    padding:16px 0;
    position:sticky;
    top:0;
    z-index:50;
    backdrop-filter:blur(6px);
  }
  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    text-decoration:none;
    color:var(--gold-pale);
    font-size:0.85rem;
    text-transform:uppercase;
    letter-spacing:0.5px;
    font-weight:600;
  }
  .back-link:hover{ color:var(--gold); }

  .page-head{ padding:36px 0 8px; text-align:left; }
  .page-head h1{ font-size:clamp(2rem, 8vw, 2.6rem); }
  .page-head .sub{ margin-top:8px; color:var(--gold-pale); font-size:0.95rem; }

  .panel{
    background:var(--purple-deepest);
    border:3px solid var(--line);
    border-radius:var(--radius-panel);
    overflow:hidden;
    box-shadow:var(--shadow-hard);
    margin-top:22px;
  }
  .panel-head{
    background:var(--gold);
    color:var(--ink);
    padding:14px 20px;
    font-family:'Eurostile Extended', 'Michroma', sans-serif;
    font-weight:400;
    text-transform:uppercase;
    letter-spacing:0.5px;
    font-size:1.05rem;
    border-bottom:3px solid var(--line);
  }
  .panel-body{ padding:20px; }

  label{
    display:block;
    font-size:0.82rem;
    text-transform:uppercase;
    letter-spacing:0.4px;
    color:var(--gold-pale);
    margin:16px 0 6px;
    font-weight:600;
  }
  label:first-child{ margin-top:0; }
  label .required{
    color:var(--danger);
    margin-left:2px;
  }

  select, input{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:2px solid var(--purple-light);
    background:var(--purple-deep);
    color:var(--bone);
    font-size:15px;
    font-family:inherit;
    outline:none;
    transition:border-color 0.2s ease;
  }
  select:focus, input:focus{ 
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(240,169,59,0.1);
  }
  select{ appearance:none; -webkit-appearance:none; cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16'><path d='M4 6l4 4 4-4' stroke='%23f0a93b' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat; background-position:right 14px center; padding-right:38px;
  }

  .qty-row{ display:flex; align-items:center; gap:12px; }
  .qty-btn{
    width:44px; height:44px; flex-shrink:0;
    border-radius:10px;
    border:2px solid var(--line);
    background:var(--gold);
    color:var(--ink);
    font-size:20px; font-weight:700;
    cursor:pointer;
    box-shadow:var(--shadow-hard-sm);
    transition:all 0.15s ease;
  }
  .qty-btn:hover{ transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--line); }
  .qty-btn:active{ transform:translate(2px,2px); box-shadow:2px 2px 0 var(--line); }
  .qty-val{
    flex:1; text-align:center;
    font-family:'Eurostile Extended', 'Michroma', sans-serif;
    font-size:1.3rem;
    color:var(--bone);
  }

  .summary{
    margin-top:18px;
    border:2px dashed rgba(244,236,219,0.3);
    border-radius:14px;
    padding:14px 16px;
  }
  .summary-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 0;
    border-bottom:1px dashed rgba(244,236,219,0.2);
    font-size:0.92rem;
  }
  .summary-row:last-child{ border-bottom:none; }
  .summary-row.total{ padding-top:12px; }
  .summary-row.total .label{
    font-family:'Eurostile Extended', 'Michroma', sans-serif;
    text-transform:uppercase;
    font-size:0.95rem;
    color:var(--bone);
  }
  .summary-row.total .amount{
    font-family:'Eurostile Extended', 'Michroma', sans-serif;
    font-weight:700;
    font-size:1.4rem;
    color:var(--gold);
  }
  .summary-row .amount-sm{ color:var(--gold-pale); }

  .pay-btn{
    display:block; width:100%; margin-top:20px;
    padding:16px 20px;
    border-radius:10px;
    border:3px solid var(--line);
    background:var(--gold);
    color:var(--ink);
    font-family:'Eurostile Extended', 'Michroma', sans-serif;
    font-weight:700; font-size:1rem;
    text-transform:uppercase; letter-spacing:0.5px;
    cursor:pointer;
    box-shadow:var(--shadow-hard-sm);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .pay-btn:hover{ transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--line); }
  .pay-btn:active{ transform:translate(0,0); box-shadow:2px 2px 0 var(--line); }
  .pay-btn:disabled{ opacity:0.6; cursor:wait; transform:none; box-shadow:var(--shadow-hard-sm); }

  .hidden{ display:none !important; }
  .resume{
    margin-top:22px; padding:16px 18px;
    border:3px solid var(--line); border-radius:16px;
    background:var(--purple-deep); box-shadow:var(--shadow-hard-sm);
    font-size:0.92rem; line-height:1.5;
  }
  .resume.paid{ border-color:#5fbf8f; }
  .resume.pending{ border-color:var(--gold); }
  .resume-title{ font-weight:700; color:var(--bone); margin:0 0 4px; }
  .resume-text{ color:var(--gold-pale); margin:0 0 12px; }
  .resume-links{ display:flex; flex-direction:column; gap:8px; }
  .resume-link{
    display:block; text-align:center; text-decoration:none;
    padding:12px 14px; border-radius:10px; border:2px solid var(--line);
    background:var(--gold); color:var(--ink); font-weight:700;
    box-shadow:var(--shadow-hard-sm);
  }
  .promo{ margin-top:18px; }
  .promo-toggle{
    background:none; border:none; padding:0; cursor:pointer;
    color:var(--gold-pale); text-decoration:underline; text-underline-offset:3px;
    font-family:inherit; font-size:0.85rem;
  }
  .promo-row{ display:flex; gap:10px; }
  .promo-row input{ flex:1; text-transform:uppercase; letter-spacing:0.5px; }
  .promo-apply{
    flex-shrink:0; padding:0 18px; border-radius:10px;
    border:2px solid var(--line); background:var(--gold); color:var(--ink);
    font-family:inherit; font-weight:700; cursor:pointer;
    box-shadow:var(--shadow-hard-sm);
  }
  .promo-apply:disabled{ opacity:0.6; cursor:wait; }
  .promo-msg{ font-size:0.85rem; margin-top:8px; min-height:1.2em; line-height:1.4; }
  .promo-msg.ok{ color:#7fe0a6; }
  .promo-msg.err{ color:var(--danger); }
  .promo-msg button{ background:none; border:none; color:var(--gold-pale); text-decoration:underline; cursor:pointer; font:inherit; padding:0; margin-left:6px; }
  .msg{
    margin-top:14px;
    padding:12px 14px;
    border-radius:10px;
    font-size:0.88rem;
    display:none;
    border:2px solid var(--line);
  }
  .msg.error{ 
    background:rgba(224,85,106,0.15); 
    color:var(--danger); 
    border-color:var(--danger); 
    display:block; 
  }
  .msg.loading{ 
    background:rgba(244,236,219,0.08); 
    color:var(--gold-pale); 
    display:block; 
  }
  .msg.ok{
    background:rgba(95,191,143,0.1);
    color:var(--ok);
    border-color:var(--ok);
    display:block;
  }

  .terms-checkbox{
    display:flex;
    align-items:flex-start;
    gap:10px;
    margin-top:16px;
    padding:12px 14px;
    background:var(--purple-deep);
    border-radius:10px;
    border:1px solid var(--purple-light);
  }
  .terms-checkbox input[type="checkbox"]{
    width:auto;
    margin-top:2px;
    accent-color:var(--gold);
    cursor:pointer;
  }
  .terms-checkbox label{
    margin:0;
    color:var(--smoke);
    font-size:0.9rem;
    text-transform:none;
    letter-spacing:normal;
    cursor:pointer;
    flex:1;
  }
  .terms-checkbox a{
    color:var(--gold);
    text-decoration:none;
  }
  .terms-checkbox a:hover{
    text-decoration:underline;
  }

  .footnote{
    font-size:0.78rem;
    color:rgba(244,236,219,0.6);
    text-align:center;
    margin-top:22px;
  }

  .info-box{
    background:rgba(124,79,196,0.1);
    border-left:3px solid var(--purple-glow);
    padding:12px 14px;
    border-radius:8px;
    font-size:0.9rem;
    color:var(--smoke);
    margin-top:14px;
  }

  /* VIP y Vice Experience */
  .prod-note{ background:rgba(240,169,59,0.1); border-left:3px solid var(--gold); padding:10px 12px; border-radius:8px; font-size:0.88rem; color:var(--smoke); margin:10px 0 0; line-height:1.45; }
  .stock-note{ margin-top:12px; padding:8px 12px; border-radius:8px; font-size:0.9rem; font-weight:700; color:var(--gold-pale); background:rgba(224,85,106,0.12); border:1px solid var(--danger); }
  .drink-row{ display:flex; align-items:center; gap:12px; margin-bottom:8px; }
  .drink-row span{ min-width:92px; font-size:0.9rem; color:var(--gold-pale); font-weight:600; }
  .drink-row select{ flex:1; }

  /* Promo 3x2 */
  .promo-note{ margin-top:12px; padding:10px 12px; border-radius:8px; font-size:0.9rem; font-weight:700; color:var(--ink); background:var(--gold); border:2px solid var(--line); }

  /* Fila virtual */
  .queue{ text-align:center; }
  .q-sub{ margin:0 0 18px; color:var(--gold-pale); font-size:0.95rem; }
  .q-label{ font-size:0.8rem; text-transform:uppercase; letter-spacing:1px; color:var(--gold-pale); font-weight:700; }
  .q-pos{ font-family:'Eurostile Extended','Michroma',sans-serif; font-weight:700; font-size:clamp(4.5rem,24vw,8rem); line-height:1; color:var(--gold); text-shadow:4px 4px 0 var(--line); margin:6px 0 18px; font-variant-numeric:tabular-nums; }
  .q-pos.go{ color:#5fbf8f; }
  .q-summary{ margin:20px 0 6px; padding:12px 14px; border:2px dashed rgba(244,236,219,0.3); border-radius:12px; color:var(--bone); font-size:0.92rem; }
  .q-summary b{ color:var(--gold); }
  .q-hint{ margin-top:14px; font-size:0.82rem; color:rgba(244,236,219,0.6); }
  .pay-btn:disabled{ opacity:0.55; cursor:not-allowed; }
</style>
</head>
<body>

<div class="topbar">
  <div class="container">
    <a class="back-link" href="/index.html#boletas">&larr; Volver a boletería</a>
  </div>
</div>

<div class="container">
  <div class="page-head">
    <h1>Fila virtual</h1>
    <p class="sub">Skyline Halloween Fest · 30 y 31 de octubre · Secret Location</p>
  </div>

  <div class="panel">
    <div class="panel-head" id="q-head">Estás en la fila</div>
    <div class="panel-body queue">
      <p class="q-sub" id="q-sub">Cuando tu posición llegue a 0 podrás comprar tus boletas.</p>
      <div class="q-label">Tu posición en la fila</div>
      <div class="q-pos" id="q-pos">—</div>
      <div class="q-summary" id="q-summary"></div>
      <button type="button" id="go-btn" class="pay-btn" disabled>Espera tu turno…</button>
      <p class="q-hint">No cierres ni recargues esta página: si lo haces, vuelves a empezar la fila.</p>
    </div>
  </div>
  <noscript><p class="footnote">Esta página necesita JavaScript para funcionar.</p></noscript>
</div>

<script>
(function () {
  var DURATION = 135000;             // la fila dura 2 minutos y 15 segundos
  var MIN_START = 20, MAX_START = 20; // posición inicial: 20 personas
  var $ = function (id) { return document.getElementById(id); };

  // A dónde ir cuando llegue el turno: siempre una página de compra del mismo sitio (nunca un enlace externo).
  var raw = new URLSearchParams(window.location.search).get("ir") || "comprar.html";
  var target = /^comprar\.html(\?[A-Za-z0-9_=&%.\-]*)?$/.test(raw) ? raw : "comprar.html";

  // Qué va a comprar (solo para mostrarlo)
  var tp = new URLSearchParams(target.indexOf("?") >= 0 ? target.slice(target.indexOf("?")) : "");
  var producto = tp.get("producto"), tipo = tp.get("tipo");
  var label = producto === "vice" ? "Vice Experience"
    : producto === "vip" ? (tipo === "1-dia" ? "VIP 1 día" : tipo === "2-dias" ? "VIP 2 días" : "VIP")
    : (tipo === "1-dia" ? "Acceso 1 día" : tipo === "2-dias" ? "Acceso 2 días" : "Boletas");
  var sum = $("q-summary");
  sum.appendChild(document.createTextNode("Vas a comprar: "));
  var b1 = document.createElement("b"); b1.textContent = label; sum.appendChild(b1);

  // ---------- La fila: sale de 20 y baja hasta 0 en 2 min 15 s ----------
  var start = MIN_START + Math.floor(Math.random() * (MAX_START - MIN_START + 1));
  var times = [];                                         // cuándo baja cada puesto (en ms desde que entró)
  var gap = DURATION / start;                             // cada puesto tarda ~gap en bajar (con 20 puestos: ~6,7 s)
  for (var i = 1; i < start; i++) times.push(i * gap + (Math.random() - 0.5) * 0.7 * gap);   // repartidos parejo, con algo de variación
  times.push(DURATION);                                   // el último puesto baja justo al final (2 min 15 s)
  times.sort(function (a, b) { return a - b; });
  var t0 = Date.now(), ready = false;
  var pos = $("q-pos"), btn = $("go-btn");
  btn.setAttribute("data-target", target);

  function positionAt(elapsed) { var gone = 0; while (gone < times.length && times[gone] <= elapsed) gone++; return start - gone; }
  function tick() {
    var elapsed = Math.min(DURATION, Date.now() - t0), p = positionAt(elapsed);
    pos.textContent = String(p);
    if (p <= 0 && !ready) finish();
  }
  // El "pase": la página de compra solo abre si se pasó por la fila en los últimos 30 minutos (en esta pestaña).
  function grantPass() { try { sessionStorage.setItem("sky_queue_pass", String(Date.now())); } catch (e) {} }
  function finish() {
    ready = true; clearInterval(timer); grantPass();
    pos.textContent = "0"; pos.className = "q-pos go";
    $("q-head").textContent = "¡Es tu turno!"; $("q-sub").textContent = "Ya puedes comprar tus boletas.";
    btn.disabled = false; btn.textContent = "Ir a comprar mis boletas"; try { btn.focus(); } catch (e) {}
  }
  var timer = setInterval(tick, 100);
  tick();

  btn.addEventListener("click", function () {
    if (!ready) return;
    grantPass();
    btn.disabled = true; btn.textContent = "Abriendo la compra…";
    window.location.href = target;
  });
})();
</script>
</body>
</html>
