<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow">
<title>Tus boletas · Skyline Halloween Fest</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Michroma&display=swap');
  @font-face{
    font-family:'Eurostile Extended';
    src: url('https://kyaegqllwjihaoudazoh.supabase.co/storage/v1/object/public/skyline-media/Eurostile%20Extended%20Bold.ttf') format('truetype');
    font-weight: 700; font-style: normal; font-display: swap;
  }
  :root{
    --ink:#160b23; --purple-deepest:#1d0e33; --purple-deep:#2a1348; --purple:#3d1c66; --purple-light:#5a3593;
    --gold:#f0a93b; --gold-pale:#f7cf8c; --bone:#f4ecdb; --smoke:#efe6f6; --line:#0e0518;
    --ok:#5fbf8f; --danger:#e0556a;
    --radius-panel:22px; --shadow-hard: 6px 6px 0 var(--line); --shadow-hard-sm: 4px 4px 0 var(--line);
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{
    margin:0;
    background-color:var(--purple-deepest);
    background-image:
      radial-gradient(rgba(244,236,219,0.06) 1.4px, transparent 1.4px),
      linear-gradient(180deg, rgba(29,14,51,0.94) 0%, rgba(29,14,51,0.97) 60%, rgba(29,14,51,1) 100%),
      url('https://kyaegqllwjihaoudazoh.supabase.co/storage/v1/object/public/skyline-media/FONDO%202.webp');
    background-size:16px 16px, auto, 50% auto;
    background-position:0 0, center, center bottom;
    background-repeat:repeat, no-repeat, no-repeat;
    background-attachment:scroll, fixed, fixed;
    color:var(--smoke);
    font-family:'Eurostile Extended', 'Michroma', -apple-system, 'Segoe UI', sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding:28px 16px calc(40px + env(safe-area-inset-bottom, 0px));
  }
  h1{
    font-family:'Eurostile Extended', 'Michroma', sans-serif;
    font-weight:400; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--bone); margin:0 0 6px; font-size:1.55rem; line-height:1.15;
  }
  .wrap{ max-width:560px; margin:0 auto; }
  .card{
    background:var(--purple-deepest);
    border:3px solid var(--line);
    border-radius:var(--radius-panel);
    box-shadow:var(--shadow-hard);
    overflow:hidden;
  }
  .card-body{ padding:28px 22px; text-align:center; }
  .icon{ font-size:44px; margin-bottom:6px; line-height:1; }
  .status{ font-size:0.85rem; text-transform:uppercase; letter-spacing:0.5px; font-weight:700; margin-bottom:18px; }
  .status.ok{ color:var(--ok); } .status.pending{ color:var(--gold); } .status.error{ color:var(--danger); }

  .detail{
    text-align:left; background:var(--purple-deep);
    border:2px dashed rgba(244,236,219,0.25); border-radius:14px;
    padding:14px 16px; margin-top:8px;
  }
  .row{ display:flex; justify-content:space-between; gap:12px; font-size:0.88rem; padding:7px 0; border-bottom:1px dashed rgba(244,236,219,0.15); }
  .row:last-child{ border-bottom:none; }
  .row span:first-child{ color:var(--gold-pale); text-transform:uppercase; font-size:0.72rem; letter-spacing:0.4px; }
  .row span:last-child{ color:var(--bone); font-weight:600; text-align:right; }

  .note{
    margin-top:18px; padding:14px 16px; border-radius:12px; text-align:left;
    font-size:0.9rem; line-height:1.5; color:var(--bone);
  }
  .note.ok{ background:rgba(95,191,143,0.12); border:2px solid var(--ok); }
  .note.pending{ background:rgba(240,169,59,0.10); border:2px solid var(--gold); }
  .note.error{ background:rgba(224,85,106,0.12); border:2px solid var(--danger); }
  .note strong{ color:var(--gold); }

  .spinner{
    width:44px; height:44px; margin:4px auto 14px;
    border-radius:50%; border:5px solid rgba(240,169,59,0.25); border-top-color:var(--gold);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .spinner{ animation-duration:3s; } }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:13px 18px; border-radius:10px;
    border:3px solid var(--line); background:var(--gold); color:var(--ink);
    font-family:'Eurostile Extended', 'Michroma', sans-serif; font-weight:700;
    font-size:0.82rem; text-transform:uppercase; letter-spacing:0.5px;
    text-decoration:none; cursor:pointer; box-shadow:var(--shadow-hard-sm);
  }
  .btn:active{ transform:translate(2px,2px); box-shadow:2px 2px 0 var(--line); }
  .btn.ghost{ background:var(--purple); color:var(--bone); }
  .btn.wa{ background:#25d366; color:#08130c; }
  .btn.block{ display:flex; width:100%; margin-top:14px; }

  .tickets-head{ margin:26px 0 12px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; }
  .tickets-head h2{
    margin:0; font-family:'Eurostile Extended', 'Michroma', sans-serif; font-weight:400;
    text-transform:uppercase; font-size:1.1rem; color:var(--bone);
  }
  .tickets{ display:grid; gap:18px; }
  @media (min-width:520px){ .tickets.many{ grid-template-columns:1fr 1fr; } }
  .ticket{
    background:var(--purple-deep); border:3px solid var(--line);
    border-radius:18px; overflow:hidden; box-shadow:var(--shadow-hard-sm);
  }
  .ticket img{ display:block; width:100%; height:auto; aspect-ratio:4 / 5; background:var(--purple); }
  .ticket-actions{ display:flex; gap:8px; padding:10px; }
  .ticket-actions .btn{ flex:1; padding:11px 8px; font-size:0.72rem; }
  .help{ margin-top:22px; text-align:center; font-size:0.85rem; color:rgba(244,236,219,0.75); }
  .help a{ color:var(--gold-pale); }
  .loading{ color:var(--gold-pale); font-size:0.9rem; }
</style>

<script>

  var LOGO = "https://kyaegqllwjihaoudazoh.supabase.co/storage/v1/object/public/skyline-media/LOGO.png";
  var POLL_MS = 3000, POLL_MAX_MS = 180000;

  var params = new URLSearchParams(window.location.search);
  var orderId = params.get("bold-order-id") || params.get("o");
  var card = document.getElementById("card");
  var area = document.getElementById("tickets-area");
  var startedAt = Date.now();

  function money(n) { return "$" + Number(n).toLocaleString("es-CO"); }


  function trackPurchase(o) {
    if (!o || o.status !== "pagado" || !window.fbq || !o.id) return;
    var storageKey = "skyline_pixel_purchase_" + o.id;
    try { if (window.localStorage.getItem(storageKey)) return; } catch (e) {}
    var amount = Number(o.total);
    if (!isFinite(amount)) return;
    window.fbq("track", "Purchase", {
      value: amount,
      currency: "COP",
      content_ids: [o.access_type || "skyline-halloween-fest"],
      content_type: "product",
      num_items: Number(o.quantity) || 1
    }, { eventID: "bold_" + o.id });
    try { window.localStorage.setItem(storageKey, "1"); } catch (e) {}
  }

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  function accessLabel(a) { return a === "1-dia" ? "Acceso 1 día" : "Acceso 2 días"; }

  function header(icon, title, statusText, cls) {
    card.innerHTML = "";
    if (icon === "spinner") card.appendChild(el("div", "spinner"));
    else card.appendChild(el("div", "icon", icon));
    card.appendChild(el("h1", "", title));
    card.appendChild(el("div", "status " + cls, statusText));
  }
  function details(o) {
    var d = el("div", "detail");
    [["Boleta", accessLabel(o.access_type)], ["Cantidad", String(o.quantity)], ["Total", money(o.total)], ["Comprador", o.full_name || ""], ["# de reserva", o.id]].forEach(function (r) {
      var row = el("div", "row"); row.appendChild(el("span", "", r[0]));
      var v = el("span", "", r[1]); if (r[0] === "# de reserva") v.style.fontSize = "11px";
      row.appendChild(v); d.appendChild(row);
    });
    card.appendChild(d);
  }
  function note(cls, html) { var n = el("div", "note " + cls); n.innerHTML = html; card.appendChild(n); }

  // ---------- Estados ----------
  function renderPending(o, timedOut) {
    header(timedOut ? "⏳" : "spinner", timedOut ? "Tu pago sigue en proceso" : "Confirmando tu pago…", "Skyline Halloween Fest", "pending");
    details(o);
    note("pending", timedOut
      ? "Bold todavía no confirma el pago. <strong>Guarda este enlace</strong> o vuelve a abrirlo en unos minutos: aquí aparecerán tus boletas con su código QR cuando se apruebe."
      : "En cuanto Bold apruebe tu pago, tus boletas con código QR aparecerán aquí abajo. <strong>No cierres esta página.</strong>");
    if (timedOut) {
      var b = el("button", "btn block", "Revisar de nuevo");
      b.addEventListener("click", function () { startedAt = Date.now(); check(); });
      card.appendChild(b);
    }
  }
  function renderFailed(o) {
    header("✕", "El pago no se pudo completar", "Skyline Halloween Fest", "error");
    details(o);
    note("error", "No se realizó ningún cobro por esta reserva. Puedes intentarlo de nuevo.");
    var a = el("a", "btn block", "Intentar de nuevo"); a.href = "/comprar.html"; card.appendChild(a);
  }
  function renderNotFound() {
    header("⚠️", "No encontramos tu reserva", "Escríbenos por WhatsApp con tu número de reserva", "error");
    var a = el("a", "btn wa block", "Escríbenos por WhatsApp");
    a.href = "https://wa.me/573133308294"; a.target = "_blank"; a.rel = "noopener";
    card.appendChild(a);
  }
  function renderPaid(o) {
    trackPurchase(o);
    header("🎟️", "¡Pago confirmado!", "Skyline Halloween Fest", "ok");
    details(o);
    var many = o.tickets.length > 1;
    note("ok", "Estas son tus boletas. <strong>Descárgalas o tómales captura</strong> y preséntalas en la entrada. " +
      (many ? "Cada código QR es para <strong>una persona</strong>: si vas con amigos, compárteles la suya." : "El código QR es personal: no lo publiques."));

    area.innerHTML = "";
    if (!o.tickets.length) {
      var p = el("p", "loading", "Estamos generando tus boletas…"); p.style.textAlign = "center"; area.appendChild(p);
      setTimeout(check, POLL_MS);
      return;
    }
    var head = el("div", "tickets-head");
    head.appendChild(el("h2", "", many ? "Tus " + o.tickets.length + " boletas" : "Tu boleta"));
    var all = el("button", "btn", many ? "Descargar todas" : "Descargar");
    head.appendChild(all);
    area.appendChild(head);

    var grid = el("div", "tickets" + (many ? " many" : ""));
    area.appendChild(grid);
    var rendered = [];
    o.tickets.forEach(function (t) {
      var box = el("div", "ticket");
      var img = el("img"); img.alt = "Boleta " + t.n + " de " + t.total + ", " + accessLabel(t.access_type) + ", a nombre de " + (o.full_name || "");
      var acts = el("div", "ticket-actions");
      var dl = el("button", "btn", "Descargar");
      var sh = el("button", "btn ghost", "Compartir");
      acts.appendChild(dl); acts.appendChild(sh);
      box.appendChild(img); box.appendChild(acts); grid.appendChild(box);
      var ticket = { qr_payload: t.qr_payload, access_type: t.access_type, n: t.n, total: t.total, name: o.full_name, category: "venta" };
      rendered.push(renderTicket(ticket).then(function (blob) {
        img.src = URL.createObjectURL(blob);
        var item = { blob: blob, name: fileName(ticket) };
        dl.onclick = function () { download(item.blob, item.name); };
        sh.onclick = function () { share([item]); };
        return item;
      }));
    });
    all.onclick = function () {
      Promise.all(rendered).then(function (items) { items.forEach(function (it, i) { setTimeout(function () { download(it.blob, it.name); }, i * 350); }); });
    };
  }

  // ---------- Consulta con reintentos ----------
  var lastStatus = null;
  function check() {
    fetch(FUNCTIONS_BASE + "/get-tickets", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ order_id: orderId })
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); })
      .then(function (res) {
        if (res.status === 404) { renderNotFound(); return; }
        if (!res.ok) throw new Error("server");
        var o = res.d;
        if (o.status === "pagado") { if (lastStatus !== "pagado" || !area.querySelector(".ticket")) renderPaid(o); lastStatus = "pagado"; return; }
        if (o.status === "fallido") { renderFailed(o); lastStatus = "fallido"; return; }
        var timedOut = Date.now() - startedAt > POLL_MAX_MS;
        renderPending(o, timedOut);
        lastStatus = o.status;
        if (!timedOut) setTimeout(check, POLL_MS);
      })
      .catch(function () {
        // Error de red: reintentar sin perder la página.
        if (Date.now() - startedAt < POLL_MAX_MS) setTimeout(check, POLL_MS * 2);
        else renderNotFound();
      });
  }

  // ---------- Imagen de la boleta (mismo diseño del panel) ----------
  var logoImg = null;
  function loadLogo() {
    if (logoImg) return Promise.resolve(logoImg);
    return new Promise(function (res) {
      var i = new Image(); i.crossOrigin = "anonymous";
      i.onload = function () { logoImg = i; res(i); }; i.onerror = function () { res(null); };
      i.src = LOGO;
    });
  }
  function fontsReady() {
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    return document.fonts.load("700 40px 'Eurostile Extended'").catch(function () {});
  }
  function fitText(ctx, text, maxW, size, font) {
    var s = size;
    do { ctx.font = font.replace("{s}", s); s -= 2; } while (ctx.measureText(text).width > maxW && s > 18);
  }
  function roundRect(x, X, Y, w, h, r) {
    x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r);
    x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath();
  }
  function renderTicket(t) {
    return Promise.all([loadLogo(), fontsReady()]).then(function (r) {
      var logo = r[0];
      var W = 1080, H = 1350, c = document.createElement("canvas");
      c.width = W; c.height = H;
      var x = c.getContext("2d");
      var DISPLAY = "700 {s}px 'Eurostile Extended', 'Arial Black', sans-serif";
      var g = x.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#3d1c66"); g.addColorStop(0.55, "#2a1348"); g.addColorStop(1, "#1d0e33");
      x.fillStyle = g; x.fillRect(0, 0, W, H);
      x.fillStyle = "rgba(244,236,219,0.06)";
      for (var yy = 12; yy < H; yy += 24) for (var xx = 12; xx < W; xx += 24) { x.beginPath(); x.arc(xx, yy, 2, 0, 7); x.fill(); }
      if (logo) {
        var lw = 620, lh = logo.height * (lw / logo.width);
        if (lh > 230) { lh = 230; lw = logo.width * (lh / logo.height); }
        x.drawImage(logo, (W - lw) / 2, 50, lw, lh);
      } else {
        x.fillStyle = "#f4ecdb"; x.textAlign = "center"; x.font = DISPLAY.replace("{s}", 64);
        x.fillText("SKYLINE", W / 2, 150);
        x.fillStyle = "#f0a93b"; x.font = DISPLAY.replace("{s}", 36); x.fillText("HALLOWEEN FEST", W / 2, 205);
      }
      var tag = t.access_type === "1-dia" ? "ACCESO 1 DÍA" : "ACCESO 2 DÍAS";
      x.font = DISPLAY.replace("{s}", 34);
      var tw = x.measureText(tag).width + 64;
      x.fillStyle = "#f0a93b"; roundRect(x, (W - tw) / 2, 300, tw, 70, 35); x.fill();
      x.lineWidth = 5; x.strokeStyle = "#0e0518"; x.stroke();
      x.fillStyle = "#160b23"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(tag, W / 2, 337);
      var qr = window.qrcode(0, "M"); qr.addData(t.qr_payload); qr.make();
      var count = qr.getModuleCount(), box = 600, pad = 34;
      var cell = Math.floor((box - pad * 2) / count), qrSize = cell * count;
      var bx = (W - box) / 2, by = 410;
      x.fillStyle = "#0e0518"; roundRect(x, bx + 10, by + 10, box, box, 28); x.fill();
      x.fillStyle = "#ffffff"; roundRect(x, bx, by, box, box, 28); x.fill();
      var ox = bx + (box - qrSize) / 2, oy = by + (box - qrSize) / 2;
      x.fillStyle = "#000000";
      for (var rr = 0; rr < count; rr++) for (var cc = 0; cc < count; cc++) if (qr.isDark(rr, cc)) x.fillRect(ox + cc * cell, oy + rr * cell, cell, cell);
      x.textBaseline = "alphabetic"; x.fillStyle = "#f4ecdb";
      fitText(x, (t.name || "").toUpperCase(), W - 140, 54, DISPLAY);
      x.fillText((t.name || "").toUpperCase(), W / 2, 1110);
      x.fillStyle = "#f7cf8c"; x.font = "600 34px -apple-system, 'Segoe UI', Roboto, sans-serif";
      x.fillText("Boleta " + t.n + " de " + t.total, W / 2, 1165);
      x.fillStyle = "#f0a93b"; x.font = DISPLAY.replace("{s}", 30);
      x.fillText("30 Y 31 DE OCTUBRE · PLOT BOGOTÁ", W / 2, 1250);
      x.fillStyle = "rgba(244,236,219,0.7)"; x.font = "500 26px -apple-system, 'Segoe UI', Roboto, sans-serif";

    });

    return "skyline-" + base + "-" + t.n + "de" + t.total + ".png";
  }
  function download(blob, name) {
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }

    var files = items.map(function (it) { return new File([it.blob], it.name, { type: "image/png" }); });
    var can = false;
    try { can = !!(navigator.canShare && navigator.canShare({ files: files })); } catch (e) {}

})();
