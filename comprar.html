<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Comprar boleta · Skyline Halloween Fest</title>
<meta name="description" content="Reserva tu boleta para Skyline Halloween Fest, 30 y 31 de octubre en PLOT Bogotá." />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Michroma&display=swap');
  @font-face{
    font-family:'Eurostile Extended';
    src: url('https://kyaegqllwjihaoudazoh.supabase.co/storage/v1/object/public/skyline-media/Eurostile%20Extended%20Bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  :root{
    --ink:#160b23;
    --purple-deepest:#1d0e33;
    --purple-deep:#2a1348;
    --purple:#3d1c66;
    --purple-light:#5a3593;
    --purple-glow:#7c4fc4;
    --gold:#f0a93b;
    --gold-deep:#c97e1e;
    --gold-pale:#f7cf8c;
    --bone:#f4ecdb;
    --smoke:#efe6f6;
    --line:#0e0518;
    --danger:#e0556a;
    --radius-tag:18px;
    --radius-panel:22px;
    --shadow-hard: 6px 6px 0 var(--line);
    --shadow-hard-sm: 4px 4px 0 var(--line);
    --maxw: 640px;
  }

  *,*::before,*::after{box-sizing:border-box;}

  body{
    margin:0;
    background-color:var(--purple-deepest);
    background-image:radial-gradient(rgba(244,236,219,0.06) 1.4px, transparent 1.4px);
    background-size:16px 16px;
    color:var(--smoke);
    font-family:'Eurostile Extended', 'Michroma', -apple-system, 'Segoe UI', sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:60px;
  }

  h1,h2,.display{
    font-family:'Eurostile Extended', 'Michroma', sans-serif;
    font-weight:400;
    line-height:0.98;
    letter-spacing:0.5px;
    text-transform:uppercase;
    margin:0;
    color:var(--bone);
  }

  a{color:inherit;}

  .container{max-width:var(--maxw); margin:0 auto; padding:0 20px;}

  .topbar{
    background:rgba(29,14,51,0.92);
    border-bottom:3px solid var(--line);
    padding:16px 0;
  }
  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    text-decoration:none;
    color:var(--gold-pale);
    font-size:0.85rem;
    text-transform:uppercase;
    letter-spacing:0.5px;
    font-weight:600;
  }
  .back-link:hover{ color:var(--gold); }

  .page-head{ padding:36px 0 8px; text-align:left; }
  .page-head h1{ font-size:clamp(2rem, 8vw, 2.6rem); }
  .page-head .sub{ margin-top:8px; color:var(--gold-pale); font-size:0.95rem; }

  .panel{
    background:var(--purple-deepest);
    border:3px solid var(--line);
    border-radius:var(--radius-panel);
    overflow:hidden;
    box-shadow:var(--shadow-hard);
    margin-top:22px;
  }
  .panel-head{
    background:var(--gold);
    color:var(--ink);
    padding:14px 20px;
    font-family:'Eurostile Extended', 'Michroma', sans-serif;
    font-weight:400;
    text-transform:uppercase;
    letter-spacing:0.5px;
    font-size:1.05rem;
    border-bottom:3px solid var(--line);
  }
  .panel-body{ padding:20px; }

  label{
    display:block;
    font-size:0.82rem;
    text-transform:uppercase;
    letter-spacing:0.4px;
    color:var(--gold-pale);
    margin:16px 0 6px;
    font-weight:600;
  }
  label:first-child{ margin-top:0; }

  select, input{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:2px solid var(--purple-light);
    background:var(--purple-deep);
    color:var(--bone);
    font-size:15px;
    font-family:inherit;
    outline:none;
  }
  select:focus, input:focus{ border-color:var(--gold); }
  select{ appearance:none; -webkit-appearance:none; cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16'><path d='M4 6l4 4 4-4' stroke='%23f0a93b' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat; background-position:right 14px center; padding-right:38px;
  }

  .qty-row{ display:flex; align-items:center; gap:12px; }
  .qty-btn{
    width:44px; height:44px; flex-shrink:0;
    border-radius:10px;
    border:2px solid var(--line);
    background:var(--gold);
    color:var(--ink);
    font-size:20px; font-weight:700;
    cursor:pointer;
    box-shadow:var(--shadow-hard-sm);
  }
  .qty-btn:active{ transform:translate(2px,2px); box-shadow:2px 2px 0 var(--line); }
  .qty-val{
    flex:1; text-align:center;
    font-family:'Eurostile Extended', 'Michroma', sans-serif;
    font-size:1.3rem;
    color:var(--bone);
  }

  .summary{
    margin-top:18px;
    border:2px dashed rgba(244,236,219,0.3);
    border-radius:14px;
    padding:14px 16px;
  }
  .summary-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 0;
    border-bottom:1px dashed rgba(244,236,219,0.2);
    font-size:0.92rem;
  }
  .summary-row:last-child{ border-bottom:none; }
  .summary-row.total{ padding-top:12px; }
  .summary-row.total .label{
    font-family:'Eurostile Extended', 'Michroma', sans-serif;
    text-transform:uppercase;
    font-size:0.95rem;
    color:var(--bone);
  }
  .summary-row.total .amount{
    font-family:'Eurostile Extended', 'Michroma', sans-serif;
    font-weight:700;
    font-size:1.4rem;
    color:var(--gold);
  }
  .summary-row .amount-sm{ color:var(--gold-pale); }

  #bold-button-slot{ margin-top:20px; }

  .msg{
    margin-top:14px;
    padding:12px 14px;
    border-radius:10px;
    font-size:0.88rem;
    display:none;
    border:2px solid var(--line);
  }
  .msg.error{ background:rgba(224,85,106,0.15); color:var(--danger); border-color:var(--danger); display:block; }
  .msg.loading{ background:rgba(244,236,219,0.08); color:var(--gold-pale); display:block; }

  .footnote{
    font-size:0.78rem;
    color:rgba(244,236,219,0.6);
    text-align:center;
    margin-top:22px;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="container">
    <a class="back-link" href="/index.html#boletas">&larr; Volver a boletería</a>
  </div>
</div>

<div class="container">
  <div class="page-head">
    <h1>Reserva tu boleta</h1>
    <p class="sub">Skyline Halloween Fest · 30 y 31 de octubre · PLOT Bogotá</p>
  </div>

  <div class="panel">
    <div class="panel-head">Tu boleta</div>
    <div class="panel-body">
      <label for="access_type">Tipo de acceso</label>
      <select id="access_type"></select>

      <label>Cantidad de boletas</label>
      <div class="qty-row">
        <button type="button" class="qty-btn" id="qty-minus" aria-label="Restar">&minus;</button>
        <span class="qty-val" id="qty-val">1</span>
        <button type="button" class="qty-btn" id="qty-plus" aria-label="Sumar">+</button>
      </div>

      <div class="summary">
        <div class="summary-row"><span>Precio unitario</span><span class="amount-sm" id="unit-price">—</span></div>
        <div class="summary-row"><span>Boletas</span><span class="amount-sm" id="qty-echo">1</span></div>
        <div class="summary-row total"><span class="label">Total a pagar</span><span class="amount" id="total-price">—</span></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">Tus datos</div>
    <div class="panel-body">
      <label for="full_name">Nombre completo</label>
      <input id="full_name" type="text" autocomplete="name" />

      <label for="document_id">Número de documento</label>
      <input id="document_id" type="text" inputmode="numeric" autocomplete="off" />

      <label for="email">Correo electrónico</label>
      <input id="email" type="email" autocomplete="email" />

      <label for="phone">Teléfono (WhatsApp)</label>
      <input id="phone" type="tel" autocomplete="tel" />

      <div id="bold-button-slot"></div>
      <div id="msg" class="msg"></div>
    </div>
  </div>

  <p class="footnote">Tu boleta se confirma automáticamente en cuanto el pago con Bold sea aprobado.</p>
</div>

<script>
(function () {
  var FUNCTIONS_BASE = "https://kyaegqllwjihaoudazoh.supabase.co/functions/v1";

  // Visual only — the real charge is always recalculated server-side by create-bold-order.
  var PRICES = {
    "2-dias": { label: "Acceso 2 días", price: 35000, stage: "Lanzamiento" },
    "1-dia":  { label: "Acceso 1 día",  price: 25000, stage: "Lanzamiento" }
  };

  var params = new URLSearchParams(window.location.search);
  var initialTipo = params.get("tipo") === "1-dia" ? "1-dia" : "2-dias";

  var accessSelect = document.getElementById("access_type");
  Object.keys(PRICES).forEach(function (key) {
    var opt = document.createElement("option");
    opt.value = key;
    opt.textContent = PRICES[key].label + " — $" + PRICES[key].price.toLocaleString("es-CO") + " (" + PRICES[key].stage + ")";
    accessSelect.appendChild(opt);
  });
  accessSelect.value = initialTipo;

  var qty = 1;
  var qtyVal = document.getElementById("qty-val");
  var qtyEcho = document.getElementById("qty-echo");
  var unitPriceEl = document.getElementById("unit-price");
  var totalPriceEl = document.getElementById("total-price");

  function money(n) { return "$" + n.toLocaleString("es-CO"); }

  function renderTotals() {
    var info = PRICES[accessSelect.value];
    qtyVal.textContent = qty;
    qtyEcho.textContent = qty;
    unitPriceEl.textContent = money(info.price);
    totalPriceEl.textContent = money(info.price * qty);
  }

  document.getElementById("qty-minus").addEventListener("click", function () {
    if (qty > 1) { qty--; renderTotals(); renderBoldButton(); }
  });
  document.getElementById("qty-plus").addEventListener("click", function () {
    if (qty < 10) { qty++; renderTotals(); renderBoldButton(); }
  });
  accessSelect.addEventListener("change", function () { renderTotals(); renderBoldButton(); });

  function showMsg(text, type) {
    var msg = document.getElementById("msg");
    msg.textContent = text;
    msg.className = "msg " + (type || "error");
  }
  function clearMsg() {
    var msg = document.getElementById("msg");
    msg.className = "msg";
    msg.textContent = "";
  }

  function currentBuyer() {
    return {
      access_type: accessSelect.value,
      quantity: qty,
      full_name: document.getElementById("full_name").value.trim(),
      document_id: document.getElementById("document_id").value.trim(),
      email: document.getElementById("email").value.trim(),
      phone: document.getElementById("phone").value.trim()
    };
  }

  var boldRequestToken = 0;
  function renderBoldButton() {
    var slot = document.getElementById("bold-button-slot");
    slot.innerHTML = "";
    clearMsg();

    var buyer = currentBuyer();
    if (!buyer.full_name || !buyer.document_id || !buyer.email || !buyer.phone) {
      return;
    }

    var myToken = ++boldRequestToken;
    showMsg("Preparando tu pago…", "loading");

    fetch(FUNCTIONS_BASE + "/create-bold-order", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(buyer)
    })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        if (myToken !== boldRequestToken) return;
        if (!res.ok) {
          showMsg(res.data.error || "No pudimos preparar tu pago. Revisa los datos e intenta de nuevo.");
          return;
        }
        clearMsg();
        var d = res.data;
        var script = document.createElement("script");
        script.setAttribute("data-bold-button", "dark-L");
        script.setAttribute("data-order-id", d.order_id);
        script.setAttribute("data-currency", d.currency);
        script.setAttribute("data-amount", String(d.amount));
        script.setAttribute("data-api-key", d.api_key);
        script.setAttribute("data-integrity-signature", d.integrity_signature);
        script.setAttribute("data-redirection-url", d.redirection_url);
        script.setAttribute("data-description", d.description);
        script.setAttribute(
          "data-customer-data",
          JSON.stringify({
            email: buyer.email,
            fullName: buyer.full_name,
            phone: buyer.phone,
            dialCode: "+57",
            documentNumber: buyer.document_id,
            documentType: "CC"
          })
        );
        slot.appendChild(script);

        // The Bold library must load AFTER the configured [data-bold-button]
        // script is already in the DOM, or it won't detect it.
        var prevLib = document.getElementById("bold-lib-script");
        if (prevLib) prevLib.remove();
        var lib = document.createElement("script");
        lib.id = "bold-lib-script";
        lib.src = "https://checkout.bold.co/library/boldPaymentButton.js";
        document.body.appendChild(lib);
      })
      .catch(function () {
        if (myToken !== boldRequestToken) return;
        showMsg("No pudimos conectar con el servidor de pagos. Intenta de nuevo.");
      });
  }

  var debounceTimer;
  ["full_name", "document_id", "email", "phone"].forEach(function (id) {
    document.getElementById(id).addEventListener("input", function () {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(renderBoldButton, 500);
    });
  });

  renderTotals();
})();
</script>
</body>
</html>
